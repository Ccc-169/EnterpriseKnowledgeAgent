<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', '微软雅黑', sans-serif;
    background: #f2f6fa;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #df-page {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: row;
  }

  /* ========== SIDEBAR ========== */
  .sidebar {
    width: 220px;
    min-width: 220px;
    height: 100vh;
    background: linear-gradient(180deg, #0f2a5e 0%, #1a3a7e 40%, #0d2050 100%);
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 10;
    box-shadow: 2px 0 16px rgba(10,30,80,0.18);
  }

  .sidebar-logo {
    padding: 20px 18px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }

  .sidebar-logo-icon {
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.15);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid rgba(255,255,255,0.25);
    flex-shrink: 0;
  }
  .sidebar-logo-icon svg { width: 20px; height: 20px; fill: white; }

  .sidebar-logo-text h2 { font-size: 14px; font-weight: 700; color: white; letter-spacing: 1px; }
  .sidebar-logo-text p { font-size: 10px; color: rgba(255,255,255,0.55); margin-top: 2px; }

  .nav-menu { flex: 0 0 auto; padding: 10px 10px 6px; }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 8px; cursor: pointer;
    margin-bottom: 2px;
    color: rgba(255,255,255,0.6);
    font-size: 13px; font-weight: 500;
    transition: all 0.2s; text-decoration: none;
  }
  .nav-item:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.9); }
  .nav-item.active { background: rgba(255,255,255,0.15); color: white; }
  .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }

  .sidebar-user {
    padding: 12px 14px;
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; gap: 10px; cursor: pointer;
    flex-shrink: 0; transition: background 0.15s;
  }
  .sidebar-user:hover { background: rgba(255,255,255,0.05); }

  .user-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,0.18);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; border: 1.5px solid rgba(255,255,255,0.28);
    overflow: hidden;
  }
  .user-avatar svg { width: 16px; height: 16px; fill: rgba(255,255,255,0.8); }
  .user-info { flex: 1; min-width: 0; }
  .user-info .name { font-size: 12.5px; font-weight: 600; color: white; }
  .user-info .role { font-size: 10.5px; color: rgba(255,255,255,0.48); margin-top: 1px; }
  .user-chevron { color: rgba(255,255,255,0.35); font-size: 11px; }
  .logout-btn {
    display: block; width: calc(100% - 20px); margin: 0 10px 10px;
    padding: 7px; background: transparent;
    border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
    color: rgba(255,255,255,0.38); font-size: 12px; cursor: pointer;
    font-family: inherit; text-align: center; transition: all 0.15s; flex-shrink: 0;
  }
  .logout-btn:hover { background: rgba(210,50,50,0.15); border-color: rgba(210,80,80,0.28); color: rgba(255,150,150,0.9); }

  /* ========== MAIN CONTENT ========== */
  .main-content {
    flex: 1; height: 100vh; overflow: hidden; background: #f2f6fa;
    display: flex; flex-direction: column;
  }

  /* ========== TOPBAR ========== */
  .topbar {
    position: sticky; top: 0; z-index: 5;
    background: rgba(242,246,250,0.95);
    backdrop-filter: blur(8px);
    padding: 0 32px; height: 56px;
    display: flex; align-items: center; justify-content: flex-end;
    gap: 20px; border-bottom: 1px solid rgba(200,215,230,0.5);
    flex-shrink: 0;
  }
  .topbar-item { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #5a6a8a; cursor: pointer; }
  .topbar-divider { width: 1px; height: 18px; background: #d0dae8; }
  .topbar-bell {
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #5a6a8a; border-radius: 6px; transition: background 0.15s;
  }
  .topbar-bell:hover { background: rgba(42,90,168,0.08); }
  .topbar-bell svg { width: 18px; height: 18px; }

  /* ========== PAGE BODY ========== */
  .df-body {
    flex: 1; overflow-y: auto; padding: 24px 32px 40px;
  }

  .page-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px; flex-wrap: wrap; gap: 12px;
  }
  .page-title {
    font-size: 19px; font-weight: 700; color: #1a2a4a;
    display: flex; align-items: center; gap: 10px;
  }
  .page-title-icon {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(135deg, #2a5aa8, #4f7dd0);
    display: flex; align-items: center; justify-content: center;
    color: white;
  }
  .page-title-icon svg { width: 18px; height: 18px; }
  .page-subtitle { font-size: 12.5px; color: #7a8aaa; margin-top: 2px; }

  /* ========== TOOLBAR ========== */
  .toolbar {
    background: white; border: 1px solid #e4eaf4; border-radius: 10px;
    padding: 14px 18px; margin-bottom: 14px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .toolbar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .toolbar-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .toolbar-hint { font-size: 12px; color: #7a8aaa; }
  .toolbar-hint b { color: #2a5aa8; font-weight: 600; }
  .path-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: #f4f7fb; border: 1px solid #e4eaf4; border-radius: 6px;
    padding: 4px 10px; font-size: 12px; color: #5a6a8a;
    font-family: 'Consolas', 'Monaco', monospace; max-width: 480px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .path-chip svg { width: 12px; height: 12px; fill: #7a8aaa; flex-shrink: 0; }

  /* ========== BUTTONS ========== */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 7px; font-size: 13px;
    font-weight: 500; cursor: pointer; font-family: inherit;
    border: 1px solid transparent; transition: all 0.15s;
    text-decoration: none; line-height: 1.2;
  }
  .btn svg { width: 14px; height: 14px; }
  .btn-primary { background: #2a5aa8; color: white; border-color: #2a5aa8; }
  .btn-primary:hover:not(:disabled) { background: #1a3a7e; border-color: #1a3a7e; }
  .btn-primary:disabled { background: #9ab2d6; border-color: #9ab2d6; cursor: not-allowed; }
  .btn-default { background: white; color: #5a6a8a; border-color: #d0dae8; }
  .btn-default:hover:not(:disabled) { background: #f4f7fb; border-color: #2a5aa8; color: #2a5aa8; }
  .btn-default:disabled { color: #b0bdd0; border-color: #e0e8f0; cursor: not-allowed; }
  .btn-danger { background: white; color: #c0392b; border-color: #e8c5c0; }
  .btn-danger:hover:not(:disabled) { background: #fceae8; border-color: #c0392b; }
  .btn-confirm { background: #c0392b; color: white; border-color: #c0392b; }
  .btn-confirm:hover:not(:disabled) { background: #a03325; border-color: #a03325; }

  /* ========== TABLE ========== */
  .table-card {
    background: white; border: 1px solid #e4eaf4; border-radius: 10px;
    overflow: hidden;
  }
  .df-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .df-table th {
    background: #f8fafd; color: #5a6a8a; font-weight: 600;
    padding: 11px 16px; text-align: left; font-size: 12.5px;
    border-bottom: 1px solid #e4eaf4;
  }
  .df-table td {
    padding: 12px 16px; color: #1a2a4a;
    border-bottom: 1px solid #f4f7fb; vertical-align: middle;
  }
  .df-table tbody tr:last-child td { border-bottom: none; }
  .df-table tbody tr:hover { background: #fafcff; }
  .df-table .col-name { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .df-table .col-size { color: #7a8aaa; white-space: nowrap; }
  .df-table .col-action { text-align: right; white-space: nowrap; }

  .file-type-tag {
    display: inline-block; font-size: 11px; font-weight: 600;
    padding: 2px 8px; border-radius: 10px; letter-spacing: 0.3px;
  }
  .file-type-tag.xlsx, .file-type-tag.xls { background: #e6f7f0; color: #1a9e6b; }
  .file-type-tag.csv  { background: #e8f0fc; color: #2a5aa8; }
  .file-type-tag.other { background: #f0f4f8; color: #7a8aaa; }

  .empty-state, .unconfigured {
    padding: 50px 24px; text-align: center; color: #7a8aaa; font-size: 13px;
  }
  .empty-state .empty-icon {
    width: 56px; height: 56px; margin: 0 auto 12px;
    background: #f4f7fb; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .empty-state .empty-icon svg { width: 28px; height: 28px; fill: #b0bdd0; }
  .empty-state .empty-title { color: #5a6a8a; font-weight: 600; font-size: 14px; margin-bottom: 4px; }

  /* ========== PAGINATION ========== */
  .df-pagination {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 18px; border-top: 1px solid #f4f7fb;
    background: #fafcff;
  }
  .df-pagination .page-label { font-size: 12.5px; color: #5a6a8a; }
  .df-pagination select {
    border: 1px solid #d0dae8; border-radius: 5px; padding: 4px 8px;
    font-size: 12px; color: #1a2a4a; background: white; cursor: pointer;
    outline: none; font-family: inherit;
  }
  .df-pagination button:disabled { color: #b0bdd0; border-color: #e0e8f0; cursor: not-allowed; background: white; }
  .df-pagination button:disabled:hover { background: white; border-color: #e0e8f0; color: #b0bdd0; }

  /* ========== MODAL ========== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15,30,60,0.42);
    display: none; align-items: center; justify-content: center;
    z-index: 100; backdrop-filter: blur(2px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: white; border-radius: 12px;
    min-width: 380px; max-width: 480px; width: 90%;
    box-shadow: 0 16px 48px rgba(15,30,60,0.25);
    animation: modalIn 0.18s ease-out;
  }
  @keyframes modalIn {
    from { transform: translateY(-12px) scale(0.97); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid #f0f4f8;
  }
  .modal-header h3 { font-size: 15px; font-weight: 600; color: #1a2a4a; }
  .modal-close {
    background: none; border: none; color: #9aaac0; font-size: 18px;
    cursor: pointer; padding: 2px 8px; border-radius: 5px; line-height: 1;
    font-family: inherit; transition: all 0.15s;
  }
  .modal-close:hover { background: #f4f7fb; color: #1a2a4a; }
  .modal-body { padding: 18px 20px; font-size: 13.5px; color: #1a2a4a; line-height: 1.7; }
  .modal-body .file-name {
    background: #f4f7fb; padding: 2px 6px; border-radius: 4px;
    font-family: 'Consolas', 'Monaco', monospace; font-size: 12.5px;
    color: #2a5aa8;
  }
  .modal-footer {
    display: flex; gap: 8px; justify-content: flex-end;
    padding: 12px 20px 16px; border-top: 1px solid #f0f4f8;
  }

  /* ========== TOAST ========== */
  .toast {
    position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
    padding: 10px 18px; border-radius: 8px; font-size: 13px;
    box-shadow: 0 6px 20px rgba(15,30,60,0.18);
    z-index: 200; opacity: 0; transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { background: #1a9e6b; color: white; }
  .toast.error   { background: #c0392b; color: white; }
  .toast.info    { background: #2a5aa8; color: white; }

  /* ========== RESPONSIVE ========== */
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .topbar { padding: 0 16px; }
    .df-body { padding: 16px; }
  }
</style>
<script src="config.js"></script>
</head>

          <input type="file" id="df-file-input" multiple accept=".xlsx,.xls,.csv" style="display:none">
          <button class="btn btn-primary" id="df-upload-btn" onclick="document.getElementById('df-file-input').click()">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
            上传文件
          </button>
          <button class="btn btn-default" onclick="loadDataFiles()">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            刷新
          </button>
          <span class="toolbar-hint">支持 <b>.xlsx / .xls / .csv</b> · 单个文件最大 <b>100 MB</b></span>
        </div>
        <div class="toolbar-right">
          <span class="path-chip" id="df-path-chip" title="">
            <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.11 0-2 .89-2 2v12c0 1.1.89 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.11-.9-2-2-2h-8l-2-2z"/></svg>
            <span id="df-path-text">加载中…</span>
          </span>
        </div>
      </div>

      <!-- Table -->
      <div class="table-card">
        <div id="df-table-wrap">
          <div class="empty-state">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13zM6 14h12v2H6v-2zm0-3h12v2H6v-2zm0-3h7v2H6V8z"/></svg>
            </div>
            <div class="empty-title">加载中…</div>
            <div>正在读取数据文件列表</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ========== Modal: 删除确认 ========== -->
<div class="modal-overlay" id="modal-delete">
  <div class="modal">
    <div class="modal-header">
      <h3>确认删除</h3>
      <button class="modal-close" onclick="closeModal('modal-delete')">✕</button>
    </div>
    <div class="modal-body">
      确定要删除文件 <span class="file-name" id="delete-filename">—</span> 吗？<br>
      <span style="color:#c0392b">删除后无法恢复，且 data_agent 将无法再访问此文件。</span>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeModal('modal-delete')">取消</button>
      <button class="btn btn-confirm" id="delete-confirm-btn" onclick="confirmDelete()">删除</button>
    </div>
  </div>
</div>

<!-- ========== Modal: 覆盖确认 ========== -->
<div class="modal-overlay" id="modal-overwrite">
  <div class="modal">
    <div class="modal-header">
      <h3>文件已存在</h3>
      <button class="modal-close" onclick="closeOverwriteModal()">✕</button>
    </div>
    <div class="modal-body">
      文件 <span class="file-name" id="overwrite-filename">—</span> 已存在，<br>
      是否要覆盖原有文件？
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeOverwriteModal()">取消</button>
      <button class="btn btn-primary" id="overwrite-confirm-btn" onclick="confirmOverwrite()">覆盖</button>
    </div>
  </div>
</div>

<!-- ========== Toast ========== -->
<div class="toast" id="toast"></div>

<script>
  const API_BASE = window.APP_CONFIG.api_base;

  // ── 时钟 ────────────────────────────────────────
  function updateClock() {
    const now = new Date(), pad = n => String(n).padStart(2, '0');
    document.getElementById('topbar-clock').textContent =
      `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  }
  updateClock(); setInterval(updateClock, 1000);

  // ── 通用工具 ────────────────────────────────────
  function authHeaders() {
    return { 'Authorization': 'Bearer ' + localStorage.getItem('token') };
  }

  function showToast(msg, type='info', duration=2400) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast ${type} show`;
    setTimeout(() => el.classList.remove('show'), duration);
  }

  function openModal(id)  { document.getElementById(id).classList.add('show'); }
  function closeModal(id) { document.getElementById(id).classList.remove('show'); }

  // ── 侧边栏 / 初始化 ─────────────────────────────
  function renderSidebarAvatar(avatarData) {
    const el = document.getElementById('sidebar-avatar-el');
    if (!el) return;
    const _path = "M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v2h20v-2c0-3.3-6.7-5-10-5z";
    el.innerHTML = avatarData
      ? `<img src="${avatarData}" style="width:32px;height:32px;object-fit:cover">`
      : `<svg viewBox="0 0 24 24"><path d="${_path}"/></svg>`;
  }

  function isAdmin() {
    try {
      const u = JSON.parse(localStorage.getItem('user') || 'null');
      return u && u.role === 'admin';
    } catch (e) { return false; }
  }

  function applyRoleVisibility() {
    // 仅管理员可见上传/删除按钮与侧边栏「数据文件」/「管理员界面」入口
    const admin = isAdmin();
    document.getElementById('df-upload-btn').style.display = admin ? '' : 'none';
    document.getElementById('nav-admin-item').style.display = admin ? '' : 'none';
    const dfNav = document.getElementById('nav-data-files-item');
    if (dfNav) dfNav.style.display = admin ? '' : 'none';
  }

  function initPage() {
    let user = null;
    try { user = JSON.parse(localStorage.getItem('user') || 'null'); } catch(e) {}
    if (!user || !localStorage.getItem('token')) { window.location.href = 'login-page.html'; return; }
    // 普通用户无权限访问此页 → 跳回首页
    if (user.role !== 'admin') {
      showToast('您没有访问此页面的权限', 'error', 3000);
      setTimeout(() => { window.location.href = 'home-page.html'; }, 800);
      return;
    }
    const roleMap = { admin: '系统管理员', user: '普通用户', visitor: '访客' };
    document.getElementById('sidebar-username').textContent = user.display_name || user.username;
    document.getElementById('sidebar-role').textContent = roleMap[user.role] || user.role;
    renderSidebarAvatar(user.avatar || null);
    applyRoleVisibility();
    loadDataFiles();

    // 监听文件选择
    document.getElementById('df-file-input').addEventListener('change', onFileInputChange);
  }

  async function logout() {
    try { await fetch(`${API_BASE}/api/auth/logout`, { method: 'POST', headers: authHeaders() }); } catch(e) {}
    localStorage.clear();
    window.location.href = 'login-page.html';
  }

  // ── 列表加载 ────────────────────────────────────
  const dfState = { files: [], page: 1, pageSize: 10, dir: '' };

  async function loadDataFiles() {
    const wrap   = document.getElementById('df-table-wrap');
    const pathEl = document.getElementById('df-path-text');
    const chipEl = document.getElementById('df-path-chip');
    wrap.innerHTML = `<div class="empty-state"><div class="empty-icon">
      <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13zM6 14h12v2H6v-2zm0-3h12v2H6v-2zm0-3h7v2H6V8z"/></svg>
    </div><div class="empty-title">加载中…</div></div>`;
    try {
      const r = await fetch(`${API_BASE}/api/admin/data-files`, { headers: authHeaders() });
      if (r.status === 503) {
        const d = await r.json();
        wrap.innerHTML = `<div class="unconfigured">${d.detail}</div>`;
        pathEl.textContent = '未配置';
        chipEl.title = '';
        dfState.dir = '';
        return;
      }
      if (!r.ok) throw new Error('获取数据文件失败（HTTP ' + r.status + '）');
      const d = await r.json();
      dfState.dir   = d.dir;
      dfState.files = d.files;
      dfState.page  = 1;
      pathEl.textContent = d.dir;
      chipEl.title  = d.dir;
      renderTable();
    } catch (err) {
      wrap.innerHTML = `<div class="unconfigured" style="color:#c0392b">${err.message}</div>`;
    }
  }

  function renderTable() {
    const wrap = document.getElementById('df-table-wrap');
    const { files, page, pageSize } = dfState;
    if (!files.length) {
      wrap.innerHTML = `<div class="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13zM6 14h12v2H6v-2zm0-3h12v2H6v-2zm0-3h7v2H6V8z"/></svg>
        </div>
        <div class="empty-title">目录下暂无文件</div>
        <div>点击右上角「上传文件」按钮，将 Excel / CSV 文件添加到该目录</div>
      </div>`;
      return;
    }
    const total      = files.length;
    const totalPages = Math.max(1, Math.ceil(total / pageSize));
    const cur        = Math.min(page, totalPages);
    dfState.page     = cur;
    const slice      = files.slice((cur - 1) * pageSize, cur * pageSize);
    const admin      = isAdmin();
    const extClass   = ext => ['xlsx','xls'].includes(ext) ? ext : ext === 'csv' ? 'csv' : 'other';
    const extLabel   = ext => (ext && ext !== '—') ? ext.toUpperCase() : '—';

    wrap.innerHTML = `
      <table class="df-table">
        <thead><tr>
          <th style="width:90px">类型</th>
          <th>文件名</th>
          <th style="width:120px">大小</th>
          <th style="width:120px" class="col-action">操作</th>
        </tr></thead>
        <tbody>${slice.map(f => `<tr>
          <td><span class="file-type-tag ${extClass(f.ext)}">${extLabel(f.ext)}</span></td>
          <td class="col-name" title="${escapeAttr(f.name)}">${escapeHtml(f.name)}</td>
          <td class="col-size">${formatSize(f.size_kb)}</td>
          <td class="col-action">${admin
            ? `<button class="btn btn-danger" onclick="askDelete('${escapeAttr(f.name)}')">删除</button>`
            : `<span style="color:#b0bdd0;font-size:12px">只读</span>`}
          </td>
        </tr>`).join('')}</tbody>
      </table>
      <div class="df-pagination">
        <button class="btn btn-default" onclick="goPage(${cur-1})" ${cur<=1?'disabled':''}>上一页</button>
        <span class="page-label">第 ${cur} / ${totalPages} 页 · 共 ${total} 个文件</span>
        <button class="btn btn-default" onclick="goPage(${cur+1})" ${cur>=totalPages?'disabled':''}>下一页</button>
        <span style="margin-left:8px;font-size:12px;color:#7a8aaa">每页</span>
        <select onchange="changePageSize(this.value)">
          <option value="5"  ${pageSize===5?'selected':''}>5 条</option>
          <option value="10" ${pageSize===10?'selected':''}>10 条</option>
          <option value="20" ${pageSize===20?'selected':''}>20 条</option>
        </select>
      </div>`;
  }

  function goPage(p) {
    const totalPages = Math.max(1, Math.ceil(dfState.files.length / dfState.pageSize));
    dfState.page = Math.max(1, Math.min(p, totalPages));
    renderTable();
  }
  function changePageSize(v) { dfState.pageSize = parseInt(v); dfState.page = 1; renderTable(); }

  function formatSize(kb) {
    if (kb < 1024) return kb + ' KB';
    return (kb / 1024).toFixed(2) + ' MB';
  }
  function escapeHtml(s)   { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]); }
  function escapeAttr(s)   { return String(s).replace(/['"<>]/g, c => ({"'":'&#39;','"':'&quot;','<':'&lt;','>':'&gt;'})[c]); }

  // ── 上传 ────────────────────────────────────────
  let pendingFiles = [];   // 待上传的 File 列表
  let overwriteIdx = -1;   // 当前等待覆盖确认的索引
  let overwriting  = null; // 当前等待覆盖确认的 File

  function onFileInputChange(ev) {
    const files = Array.from(ev.target.files || []);
    ev.target.value = '';   // 清空以便再次选择同名文件
    if (!files.length) return;
    if (!isAdmin()) { showToast('仅管理员可上传文件', 'error'); return; }
    pendingFiles = files;
    overwriteIdx = -1;
    processNextFile();
  }

  async function processNextFile() {
    // 跳过已存在的文件 → 进入覆盖确认
    while (overwriteIdx + 1 < pendingFiles.length) {
      overwriteIdx++;
      const f = pendingFiles[overwriteIdx];
      const existed = dfState.files.some(x => x.name === f.name);
      if (existed) {
        overwriting = f;
        document.getElementById('overwrite-filename').textContent = f.name;
        openModal('modal-overwrite');
        return;
      }
      await uploadOne(f, false);
    }
    // 全部处理完毕
    pendingFiles = [];
    overwriteIdx = -1;
    overwriting  = null;
    loadDataFiles();
  }

  function closeOverwriteModal() {
    closeModal('modal-overwrite');
    // 跳过当前文件，处理下一个
    overwriting = null;
    processNextFile();
  }

  async function confirmOverwrite() {
    if (!overwriting) { closeOverwriteModal(); return; }
    closeModal('modal-overwrite');
    const f = overwriting;
    overwriting = null;
    await uploadOne(f, true);
    processNextFile();
  }

  async function uploadOne(file, overwrite) {
    const btn = document.getElementById('df-upload-btn');
    btn.disabled = true;
    btn.innerHTML = '上传中…';
    try {
      const fd = new FormData();
      fd.append('file', file);
      fd.append('overwrite', overwrite ? 'true' : 'false');
      const r = await fetch(`${API_BASE}/api/admin/data-files/upload`, {
        method: 'POST', headers: authHeaders(), body: fd,
      });
      if (r.status === 409) {
        // 后端兜底：理论上已在前端预检，但若后端发现冲突仍然返回
        const d = await r.json().catch(() => ({}));
        showToast(`文件「${file.name}」已存在`, 'error');
        return;
      }
      if (!r.ok) {
        const d = await r.json().catch(() => ({}));
        const msg = d.detail || `上传失败（HTTP ${r.status}）`;
        showToast(msg, 'error', 3600);
        return;
      }
      const d = await r.json();
      showToast(`${d.overwritten ? '已覆盖' : '已上传'}：${d.name}`, 'success');
    } catch (err) {
      showToast(`网络错误：${err.message}`, 'error', 3600);
    } finally {
      btn.disabled = false;
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>上传文件`;
    }
  }

  // ── 删除 ────────────────────────────────────────
  let pendingDelete = null;

  function askDelete(name) {
    if (!isAdmin()) { showToast('仅管理员可删除文件', 'error'); return; }
    pendingDelete = name;
    document.getElementById('delete-filename').textContent = name;
    openModal('modal-delete');
  }

  async function confirmDelete() {
    if (!pendingDelete) { closeModal('modal-delete'); return; }
    const name = pendingDelete;
    const btn  = document.getElementById('delete-confirm-btn');
    btn.disabled = true;
    btn.textContent = '删除中…';
    try {
      const r = await fetch(`${API_BASE}/api/admin/data-files/${encodeURIComponent(name)}`, {
        method: 'DELETE', headers: authHeaders(),
      });
      if (!r.ok) {
        const d = await r.json().catch(() => ({}));
        showToast(d.detail || `删除失败（HTTP ${r.status}）`, 'error', 3600);
        return;
      }
      showToast(`已删除：${name}`, 'success');
      closeModal('modal-delete');
      loadDataFiles();
    } catch (err) {
      showToast(`网络错误：${err.message}`, 'error', 3600);
    } finally {
      btn.disabled = false;
      btn.textContent = '删除';
      pendingDelete = null;
    }
  }

  window.addEventListener('load', initPage);
</script>

</body>
</html>
