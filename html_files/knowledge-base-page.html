<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HNGD 智能知识助手系统 - 知识库</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%234f46e5'/><text x='16' y='23' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>知</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', '微软雅黑', sans-serif;
    background: #f2f6fa;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #kb-page {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: row;
  }

  /* ========== SIDEBAR ========== */
  .sidebar {
    width: 220px;
    min-width: 220px;
    height: 100vh;
    background: linear-gradient(180deg, #0f2a5e 0%, #1a3a7e 40%, #0d2050 100%);
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 10;
    box-shadow: 2px 0 16px rgba(10,30,80,0.18);
  }

  .sidebar-logo {
    padding: 20px 18px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }

  .sidebar-logo-icon {
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.15);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid rgba(255,255,255,0.25);
    flex-shrink: 0;
  }
  .sidebar-logo-icon svg { width: 20px; height: 20px; fill: white; }

  .sidebar-logo-text h2 { font-size: 14px; font-weight: 700; color: white; letter-spacing: 1px; }
  .sidebar-logo-text p { font-size: 10px; color: rgba(255,255,255,0.55); margin-top: 2px; }

  .nav-menu { flex: 0 0 auto; padding: 10px 10px 6px; }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 8px; cursor: pointer;
    margin-bottom: 2px;
    color: rgba(255,255,255,0.6);
    font-size: 13px; font-weight: 500;
    transition: all 0.2s; text-decoration: none;
  }
  .nav-item:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.9); }
  .nav-item.active { background: rgba(255,255,255,0.15); color: white; }
  .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }

  .sidebar-user {
    padding: 12px 14px;
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; gap: 10px; cursor: pointer;
    flex-shrink: 0; transition: background 0.15s;
  }
  .sidebar-user:hover { background: rgba(255,255,255,0.05); }

  .user-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,0.18);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; border: 1.5px solid rgba(255,255,255,0.28);
    overflow: hidden;
  }
  .user-avatar svg { width: 16px; height: 16px; fill: rgba(255,255,255,0.8); }
  .user-info { flex: 1; min-width: 0; }
  .user-info .name { font-size: 12.5px; font-weight: 600; color: white; }
  .user-info .role { font-size: 10.5px; color: rgba(255,255,255,0.48); margin-top: 1px; }
  .user-chevron { color: rgba(255,255,255,0.35); font-size: 11px; }
  .logout-btn {
    display: block; width: calc(100% - 20px); margin: 0 10px 10px;
    padding: 7px; background: transparent;
    border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
    color: rgba(255,255,255,0.38); font-size: 12px; cursor: pointer;
    font-family: inherit; text-align: center; transition: all 0.15s; flex-shrink: 0;
  }
  .logout-btn:hover { background: rgba(210,50,50,0.15); border-color: rgba(210,80,80,0.28); color: rgba(255,150,150,0.9); }

  /* ========== MAIN CONTENT ========== */
  .main-content {
    flex: 1; height: 100vh; overflow: hidden; background: #f2f6fa;
    display: flex;
    flex-direction: column;
  }

  /* ========== TOPBAR ========== */
  .topbar {
    position: sticky; top: 0; z-index: 5;
    background: rgba(242,246,250,0.95);
    backdrop-filter: blur(8px);
    padding: 0 32px; height: 56px;
    display: flex; align-items: center; justify-content: flex-end;
    gap: 20px; border-bottom: 1px solid rgba(200,215,230,0.5);
    flex-shrink: 0;
  }
  .topbar-item { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #5a6a8a; cursor: pointer; }
  .topbar-divider { width: 1px; height: 18px; background: #d0dae8; }
  .topbar-bell {
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #5a6a8a; border-radius: 6px; transition: background 0.15s;
  }
  .topbar-bell:hover { background: rgba(42,90,168,0.08); }
  .topbar-bell svg { width: 18px; height: 18px; }

  /* ========== IFRAME AREA ========== */
  .iframe-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .iframe-wrap iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* Loading overlay */
  .iframe-loading {
    position: absolute;
    inset: 0;
    background: #f2f6fa;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    z-index: 2;
    transition: opacity 0.3s;
  }
  .iframe-loading.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .loading-spinner {
    width: 40px; height: 40px;
    border: 3px solid #e4eaf4;
    border-top: 3px solid #2a5aa8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-size: 14px;
    color: #7a8aaa;
    font-weight: 500;
  }

  /* Error overlay */
  .iframe-error {
    position: absolute;
    inset: 0;
    background: #f2f6fa;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    z-index: 3;
    display: none;
  }
  .iframe-error.show {
    display: flex;
  }
  .error-icon {
    width: 56px; height: 56px;
    background: #f0f4f8;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .error-icon svg { width: 28px; height: 28px; fill: #c0392b; }
  .error-title { font-size: 16px; font-weight: 600; color: #1a2a4a; }
  .error-desc { font-size: 13px; color: #7a8aaa; max-width: 380px; text-align: center; line-height: 1.6; }
  .error-retry-btn {
    padding: 8px 20px;
    background: #2a5aa8;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 500;
    transition: background 0.15s;
  }
  .error-retry-btn:hover { background: #1a3a7e; }
  .error-retry-btn:focus-visible { outline: 2px solid #2a5aa8; outline-offset: 2px; }

  /* ========== RESPONSIVE ========== */
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .topbar { padding: 0 16px; }
  }
</style>
<script src="config.js"></script>
</head>
<body>

<div id="kb-page">
  <!-- ========== SIDEBAR ========== -->
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.35C17.25 22.15 21 17.25 21 12V7L12 2zm0 2.18l7 3.9V12c0 4.35-2.98 8.4-7 9.63C7.98 20.4 5 16.35 5 12V8.08l7-3.9z"/>

      </a>

      </a>
      <a class="nav-item" href="more-features-page.html">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
        更多功能
      </a>
      <a class="nav-item" href="setting-page.html">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>

      </a>
      <a class="nav-item" id="nav-admin-item" href="admin-page.html" style="display:none">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 14l-3-3 1.41-1.41L11 12.17l4.59-4.58L17 9l-6 6z"/></svg>

      </a>
    </nav>

    <div style="flex: 1;"></div>

    <div class="sidebar-user" onclick="window.location.href='setting-page.html'" title="账号设置">
      <div class="user-avatar" id="sidebar-avatar-el">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v2h20v-2c0-3.3-6.7-5-10-5z"/></svg>
      </div>
      <div class="user-info">
        <div class="name" id="sidebar-username">加载中...</div>
        <div class="role" id="sidebar-role">—</div>
      </div>
      <span class="user-chevron">›</span>
    </div>
    <button class="logout-btn" onclick="logout()">退出登录</button>
  </div>

  <!-- ========== MAIN CONTENT ========== -->
  <div class="main-content">
    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar-item">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/></svg>
        使用指南
      </div>
      <div class="topbar-divider"></div>
      <div class="topbar-item">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/></svg>
        <span id="topbar-clock">2024-05-20 15:30:45</span>
      </div>
      <div class="topbar-bell">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
      </div>
    </div>

    <!-- iframe area -->
    <div class="iframe-wrap">
      <div class="iframe-loading" id="iframe-loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在加载知识库管理平台…</div>
      </div>
      <div class="iframe-error" id="iframe-error">
        <div class="error-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        </div>
        <div class="error-title">知识库平台无法访问</div>
        <div class="error-desc">请确认 RAGFlow 服务正在运行，且地址配置正确。</div>
        <button class="error-retry-btn" onclick="retryIframe()">重新加载</button>
      </div>
      <iframe id="kb-iframe" src="" title="RAGFlow 知识库管理平台"></iframe>
    </div>
  </div>
</div>

<script>
  const API_BASE = window.APP_CONFIG.api_base;
  const RAGFLOW_URL = 'http://192.168.1.155/';

  // ── 时钟 ──
  function updateClock() {
    const now = new Date(), pad = n => String(n).padStart(2, '0');
    document.getElementById('topbar-clock').textContent =
      `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  }
  updateClock(); setInterval(updateClock, 1000);

  // ── 侧边栏初始化 ──
  function renderSidebarAvatar(avatarData) {
    const el = document.getElementById('sidebar-avatar-el');
    if (!el) return;
    const _path = "M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v2h20v-2c0-3.3-6.7-5-10-5z";
    el.innerHTML = avatarData
      ? `<img src="${avatarData}" style="width:32px;height:32px;object-fit:cover">`
      : `<svg viewBox="0 0 24 24"><path d="${_path}"/></svg>`;
  }

  function initPage() {
    let user = null;
    try { user = JSON.parse(localStorage.getItem('user') || 'null'); } catch(e) {}
    if (!user || !localStorage.getItem('token')) { window.location.href = 'login-page.html'; return; }
    const roleMap = { admin: '系统管理员', user: '普通用户', visitor: '访客' };
    document.getElementById('sidebar-username').textContent = user.display_name || user.username;
    document.getElementById('sidebar-role').textContent = roleMap[user.role] || user.role;
    renderSidebarAvatar(user.avatar || null);
    if (user.role === 'admin') {
      const adminItem = document.getElementById('nav-admin-item');
      if (adminItem) adminItem.style.display = '';
      const dfItem = document.getElementById('nav-data-files-item');
      if (dfItem) dfItem.style.display = '';
    }
    loadIframe();
  }

  async function logout() {
    try { await fetch(`${API_BASE}/api/auth/logout`, { method: 'POST', headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') } }); } catch(e) {}
    localStorage.clear();
    window.location.href = 'login-page.html';
  }

  // ── iframe 加载 ──
  function loadIframe() {
    const iframe = document.getElementById('kb-iframe');
    const loading = document.getElementById('iframe-loading');
    const error = document.getElementById('iframe-error');

    loading.classList.remove('hidden');
    error.classList.remove('show');

    iframe.src = RAGFLOW_URL;

    iframe.onload = function() {
      // iframe 加载完成，隐藏 loading
      loading.classList.add('hidden');
    };

    iframe.onerror = function() {
      loading.classList.add('hidden');
      error.classList.add('show');
    };

    // 超时检测：5秒后如果 loading 还没消失，显示错误
    setTimeout(() => {
      if (!loading.classList.contains('hidden')) {
        // 注意：跨域 iframe 的 onload 可能不会触发
        // 但如果 iframe 确实已经渲染了内容，我们就不该显示错误
        // 这里做一个简单判断：尝试检测 iframe 是否有内容
        try {
          // 如果能访问 iframe 内容（同源），说明已加载
          if (iframe.contentDocument && iframe.contentDocument.body.innerHTML) {
            loading.classList.add('hidden');
            return;
          }
        } catch(e) {
          // 跨域无法访问 contentDocument，这是正常的
          // 跨域情况下 onload 仍会在 iframe 完成加载时触发
          // 如果 10秒还没触发，再显示错误
        }
      }
    }, 5000);

    // 更宽松的超时：10秒
    setTimeout(() => {
      if (!loading.classList.contains('hidden')) {
        loading.classList.add('hidden');
        // 跨域 iframe 可能 onload 不会触发，但 iframe 可能仍在正常加载
        // 不强制显示错误，让 iframe 保持当前状态
      }
    }, 10000);
  }

  function retryIframe() {
    loadIframe();
  }

  window.addEventListener('load', initPage);
</script>

</body>
</html>
