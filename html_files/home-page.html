<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HNGD 智能知识助手系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', '微软雅黑', sans-serif;
    background: #e8eef5;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* ========== HOME PAGE ========== */
  #home-page {
    width: 100%;
    height: 100vh;
    display: flex;
    opacity: 1;
    flex-direction: row;
    background: #f0f4f8;
  }

  /* Sidebar */
  .sidebar {
    width: 180px;
    min-width: 180px;
    height: 100vh;
    background: linear-gradient(180deg, #0f2a5e 0%, #1a3a7e 40%, #0d2050 100%);
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 10;
    box-shadow: 2px 0 16px rgba(10,30,80,0.18);
  }

  .sidebar-logo {
    padding: 22px 18px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    margin-bottom: 12px;
  }

  .sidebar-logo-icon {
    width: 38px;
    height: 38px;
    background: rgba(255,255,255,0.15);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid rgba(255,255,255,0.25);
    flex-shrink: 0;
  }

  .sidebar-logo-icon svg { width: 22px; height: 22px; fill: white; }

  .sidebar-logo-text h2 {
    font-size: 14px;
    font-weight: 700;
    color: white;
    letter-spacing: 1px;
  }
  .sidebar-logo-text p {
    font-size: 10px;
    color: rgba(255,255,255,0.55);
    margin-top: 2px;
  }

  .nav-menu {
    flex: 1;
    padding: 8px 10px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 4px;
    color: rgba(255,255,255,0.65);
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
    text-decoration: none;
  }

  .nav-item:hover {
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.9);
  }

  .nav-item.active {
    background: rgba(255,255,255,0.15);
    color: white;
  }

  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }

  .sidebar-user {
    padding: 14px 16px;
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }

  .user-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border: 1.5px solid rgba(255,255,255,0.3);
  }

  .user-avatar svg { width: 18px; height: 18px; fill: rgba(255,255,255,0.8); }

  .user-info { flex: 1; min-width: 0; }
  .user-info .name { font-size: 13px; font-weight: 600; color: white; }
  .user-info .role { font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 1px; }

  .user-chevron { color: rgba(255,255,255,0.4); font-size: 12px; }

  /* Main content */
  .main-content {
    flex: 1;
    height: 100vh;
    overflow-y: auto;
    position: relative;
    background: #f2f6fa;
  }

  /* Top bar */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: rgba(242,246,250,0.95);
    backdrop-filter: blur(8px);
    padding: 0 32px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 20px;
    border-bottom: 1px solid rgba(200,215,230,0.5);
  }

  .topbar-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: #5a6a8a;
    cursor: pointer;
  }

  .topbar-item svg { width: 14px; height: 14px; }

  .topbar-divider {
    width: 1px;
    height: 18px;
    background: #d0dae8;
  }

  .topbar-bell {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #5a6a8a;
    border-radius: 6px;
    transition: background 0.15s;
  }
  .topbar-bell:hover { background: rgba(42,90,168,0.08); }
  .topbar-bell svg { width: 18px; height: 18px; }

  /* Home content */
  .home-body {
    padding: 32px 32px 40px;
    position: relative;
  }

  /* Background watermark */
  .home-body::before {
    content: '';
    position: absolute;
    right: 0;
    top: 0;
    width: 55%;
    height: 100%;
    background-image: url('/mnt/user-data/uploads/登录界面背景.png');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: right top;
    opacity: 0.05;
    pointer-events: none;
  }

  .greeting-section { margin-bottom: 28px; position: relative; z-index: 1; }

  .greeting-section h2 {
    font-size: 22px;
    font-weight: 700;
    color: #1a2a4a;
    margin-bottom: 5px;
  }

  .greeting-section p {
    font-size: 13.5px;
    color: #7a8aaa;
  }

  /* Feature cards */
  .feature-cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
    position: relative;
    z-index: 1;
  }

  .feature-card {
    background: white;
    border-radius: 12px;
    padding: 20px 18px;
    cursor: pointer;
    transition: all 0.2s;
    border: 1.5px solid rgba(210,225,240,0.6);
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: 14px;
    box-shadow: 0 2px 8px rgba(26,58,110,0.04);
  }

  .feature-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(26,58,110,0.1);
    border-color: rgba(42,90,168,0.2);
  }

  .feature-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .feature-icon svg { width: 22px; height: 22px; }

  .feature-icon.blue { background: #e8f0fc; }
  .feature-icon.blue svg { fill: #2a5aa8; }
  .feature-icon.green { background: #e8f8f0; }
  .feature-icon.green svg { fill: #2a9a5a; }
  .feature-icon.purple { background: #f0e8fc; }
  .feature-icon.purple svg { fill: #7a42d8; }
  .feature-icon.orange { background: #fff0e8; }
  .feature-icon.orange svg { fill: #e06a20; }

  .feature-text h3 {
    font-size: 14px;
    font-weight: 700;
    color: #1a2a4a;
    margin-bottom: 4px;
  }

  .feature-text p {
    font-size: 12px;
    color: #8a9ab8;
    line-height: 1.5;
  }

  /* Chat section */
  .chat-section {
    position: relative;
    z-index: 1;
  }

  .chat-section h3 {
    font-size: 17px;
    font-weight: 700;
    color: #1a2a4a;
    margin-bottom: 14px;
  }

  .chat-input-area {
    background: white;
    border-radius: 12px;
    border: 1.5px solid #d0dae8;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(26,58,110,0.04);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .chat-input-area:focus-within {
    border-color: #2a5aa8;
    box-shadow: 0 0 0 3px rgba(42,90,168,0.08);
  }

  .chat-input-area input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 14px;
    color: #1a2a4a;
    font-family: inherit;
    background: transparent;
  }

  .chat-input-area input::placeholder { color: #b0bcd0; }

  .send-btn {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, #1a3a7e, #2a5aa8);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(42,90,168,0.3);
  }

  .send-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(42,90,168,0.4);
  }

  .send-btn svg { width: 18px; height: 18px; fill: white; }

  /* Suggestions */
  .suggestion-chips {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .chip-label {
    font-size: 12.5px;
    color: #7a8aaa;
    flex-shrink: 0;
  }

  .chip {
    background: white;
    border: 1.5px solid #d8e4f0;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12.5px;
    color: #3a5a8e;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .chip:hover {
    background: #e8f0fc;
    border-color: #2a5aa8;
    color: #1a3a7e;
  }

  .footer-note {
    text-align: center;
    font-size: 12px;
    color: #9aaac0;
    margin-top: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    position: relative;
    z-index: 1;
  }

  /* Real-time clock update style */
  #home-clock { letter-spacing: 0.5px; }
</style>

<script>
  // ─── Initialize ─────────────────────────────────
  function initPage() {
    // Get username from URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const username = urlParams.get('user') || 'admin';
    const displayName = username === 'admin' ? '张三' : username;
    
    // Update greeting
    const hour = new Date().getHours();
    let greeting = '上午好';
    if (hour >= 12 && hour < 18) greeting = '下午好';
    else if (hour >= 18) greeting = '晚上好';
    document.getElementById('greeting-text').textContent = `${greeting}，${displayName}`;
    document.getElementById('sidebar-username').textContent = displayName;
    
    // Start clock
    startClock();
  }

  // ─── Clock ──────────────────────────────────────
  function startClock() {
    updateClock();
    setInterval(updateClock, 1000);
  }

  function updateClock() {
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const dateStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    document.getElementById('home-clock').textContent = dateStr;
  }

  // ─── Nav active ─────────────────────────────────
  function setActive(el) {
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
  }

  // ─── Chat ───────────────────────────────────────
  function setChat(chip) {
    document.getElementById('chat-input').value = chip.textContent;
    document.getElementById('chat-input').focus();
  }

  function sendChat() {
    const input = document.getElementById('chat-input');
    if (input.value.trim()) {
      // In a real app, this would send the message. For now just clear.
      input.value = '';
      input.focus();
    }
  }

  // ─── Enter key ─────────────────────────────────
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      sendChat();
    }
  });

  // Initialize on page load
  window.addEventListener('load', initPage);
</script>

</body>
</html>
