<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HNGD 智能知识助手系统 - 登录</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%234f46e5'/><text x='16' y='23' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>知</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', '微软雅黑', sans-serif;
    background: #e8eef5;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* ========== LOGIN PAGE ========== */
  #login-page {
    width: 100%;
    height: 100vh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    background: linear-gradient(135deg, #c8d8e8 0%, #dce8f2 30%, #eaf2f8 60%, #f0f6fb 100%);
    transition: opacity 0.5s ease;
  }

  /* Background image area (left side) */
  .login-bg {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  .login-bg-scene {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 65%;
    height: 100%;
    background:
      /* Warship painted in CSS-gradient layers, supplemented by SVG inline */
      linear-gradient(180deg, transparent 40%, rgba(180,200,220,0.15) 100%);
    display: flex;
    align-items: flex-end;
  }

  /* Actual background image */
  .bg-image {
    position: absolute;
    inset: 0;
    background-image: url('../project_documents/示意图/登录界面背景.png');
    background-size: 100% 100%;
    background-position: left center;
    opacity: 1;
  }

  /* Left side text */
  .login-left-content {
    position: absolute;
    left: 0;
    top: 0;
    width: 75%;
    height: 78%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 60px;
    z-index: 2;
  }

  .login-logo {
    position: absolute;
    top: 24px;
    left: 28px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, #1a3a6e, #2d5fa8);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid rgba(255,255,255,0.3);
  }

  .logo-icon svg {
    width: 26px;
    height: 26px;
    fill: white;
  }

  .logo-text h1 {
    font-size: 16px;
    font-weight: 700;
    color: #1a3a6e;
    letter-spacing: 1px;
  }
  .logo-text p {
    font-size: 11px;
    color: #4a6a9e;
    margin-top: 1px;
  }

  .login-main-title {
    font-size: 46px;
    font-weight: 800;
    color: #1a3a6e;
    letter-spacing: 2px;
    line-height: 1.2;
    text-shadow: 0 2px 8px rgba(26,58,110,0.1);
    margin-top: 40px;
  }

  .login-subtitle {
    font-size: 15px;
    color: #3a5a8e;
    margin-top: 16px;
    letter-spacing: 3px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .login-subtitle .dot {
    color: #2a5aa8;
    font-weight: bold;
  }

  .login-divider {
    width: 180px;
    height: 2px;
    background: linear-gradient(90deg, #2a5aa8, transparent);
    margin-top: 18px;
    position: relative;
  }
  .login-divider::after {
    content: '★';
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: #2a5aa8;
    font-size: 10px;
    background: linear-gradient(135deg, #c8d8e8, #dce8f2);
    padding: 0 6px;
  }

  .login-copyright {
    position: absolute;
    bottom: 18px;
    left: 28px;
    font-size: 12px;
    color: #6a8ab8;
    z-index: 2;
  }

  /* Login form card */
  .login-card {
    position: relative;
    z-index: 10;
    width: 420px;
    margin-right: 8%;
    background: rgba(255,255,255,0.96);
    border-radius: 16px;
    padding: 44px 44px 36px;
    box-shadow: 0 8px 40px rgba(26,58,110,0.12), 0 2px 8px rgba(26,58,110,0.06);
    backdrop-filter: blur(10px);
  }

  .login-card h2 {
    font-size: 22px;
    font-weight: 700;
    color: #1a2a4a;
    text-align: center;
    margin-bottom: 6px;
  }

  .login-card .subtitle {
    font-size: 13px;
    color: #8a9ab8;
    text-align: center;
    margin-bottom: 28px;
  }

  .form-group {
    position: relative;
    margin-bottom: 16px;
  }

  .form-group .field-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #8a9ab8;
    font-size: 16px;
    z-index: 1;
  }

  .form-group input {
    width: 100%;
    height: 48px;
    border: 1.5px solid #d0dae8;
    border-radius: 8px;
    padding: 0 44px 0 42px;
    font-size: 14px;
    color: #1a2a4a;
    background: #f8fafd;
    outline: none;
    transition: all 0.2s;
    font-family: inherit;
  }

  .form-group input::placeholder { color: #b0bcd0; }

  .form-group input:focus {
    border-color: #2a5aa8;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(42,90,168,0.08);
  }

  .eye-icon {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #8a9ab8;
    cursor: pointer;
    font-size: 16px;
  }

  .form-options {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 8px 0 20px;
  }

  .remember-me {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #5a6a8a;
    cursor: pointer;
  }

  .remember-me input[type="checkbox"] {
    width: 15px;
    height: 15px;
    accent-color: #2a5aa8;
    cursor: pointer;
  }

  .forgot-link {
    font-size: 13px;
    color: #2a5aa8;
    text-decoration: none;
    cursor: pointer;
  }
  .forgot-link:hover { text-decoration: underline; }

  .login-btn {
    width: 100%;
    height: 48px;
    background: linear-gradient(135deg, #1a3a7e, #2a5aa8);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 4px;
    transition: all 0.2s;
    font-family: inherit;
    box-shadow: 0 4px 16px rgba(42,90,168,0.3);
  }

  .login-btn:hover {
    background: linear-gradient(135deg, #1a3570, #2350a0);
    box-shadow: 0 6px 20px rgba(42,90,168,0.4);
    transform: translateY(-1px);
  }

  .login-btn:active { transform: translateY(0); }

  .internal-account-note {
    text-align: center;
    font-size: 12px;
    color: #8a9ab8;
    margin-top: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .role-selector {
    display: flex;
    position: relative;
    background: #f0f4fa;
    border: 1.5px solid #d0dae8;
    border-radius: 8px;
    padding: 3px;
    margin-bottom: 20px;
  }

  .role-indicator {
    position: absolute;
    top: 3px;
    bottom: 3px;
    left: 3px;
    width: calc(50% - 3px);
    background: #2a5aa8;
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(42,90,168,0.22);
    transition: transform 0.28s cubic-bezier(0.34, 1.15, 0.64, 1);
    pointer-events: none;
  }

  .role-option {
    position: relative;
    z-index: 1;
    flex: 1;
    height: 36px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    background: transparent;
    letter-spacing: 1px;
    color: #8a9ab8;
    transition: color 0.22s;
  }

  .role-option.active {
    color: #fff;
  }

  .role-option:not(.active):hover {
    color: #4a6a9e;
  }

  .error-msg {
    font-size: 12px;
    color: #e05252;
    margin-top: 6px;
    display: none;
    padding-left: 4px;
  }

  /* Loading spinner overlay */
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(240,246,252,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(42,90,168,0.2);
    border-top-color: #2a5aa8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ════════════ 动效升级 ════════════ */

  /* ── 关键帧库 ── */
  @keyframes fadeInUp   { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes cardIn     { from { opacity: 0; transform: translateX(28px) scale(0.98); } to { opacity: 1; transform: translateX(0) scale(1); } }
  @keyframes shake      { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
  @keyframes orbFloat   { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(40px,-30px) scale(1.12); } 100% { transform: translate(0,0) scale(1); } }
  @keyframes orbFloat2  { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(-36px,28px) scale(0.9); } 100% { transform: translate(0,0) scale(1); } }
  @keyframes starPulse  { 0%,100% { transform: translate(-50%,-50%) scale(1); opacity: 1; } 50% { transform: translate(-50%,-50%) scale(1.45); opacity: 0.55; } }
  @keyframes rippleAnim { to { transform: scale(2.6); opacity: 0; } }

  /* ── 背景漂浮光斑 ── */
  .login-orbs { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  .login-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(48px);
    opacity: 0.5;
    will-change: transform;
  }
  .login-orb.o1 { width: 340px; height: 340px; left: 8%;  top: 14%; background: radial-gradient(circle, rgba(90,140,210,0.55), transparent 70%); animation: orbFloat  26s ease-in-out infinite; }
  .login-orb.o2 { width: 280px; height: 280px; left: 30%; top: 52%; background: radial-gradient(circle, rgba(150,190,235,0.5), transparent 70%);  animation: orbFloat2 32s ease-in-out infinite; }
  .login-orb.o3 { width: 220px; height: 220px; right: 32%; top: 8%;  background: radial-gradient(circle, rgba(120,170,225,0.4), transparent 70%);  animation: orbFloat  30s ease-in-out infinite 4s; }

  /* ── 入场动画 ── */
  .login-card { animation: cardIn 0.62s cubic-bezier(0.34, 1.15, 0.64, 1) both; }
  .login-main-title { animation: fadeInUp 0.6s ease both 0.1s; }
  .login-subtitle   { animation: fadeInUp 0.6s ease both 0.22s; }
  .login-divider    { animation: fadeInUp 0.6s ease both 0.34s; }
  .login-logo       { animation: fadeInUp 0.6s ease both 0.05s; }

  /* ── ★ 脉冲 ── */
  .login-divider::after { animation: starPulse 3.2s ease-in-out infinite; }

  /* ── 输入框图标聚焦微交互 ── */
  .form-group .field-icon { transition: color 0.22s, transform 0.22s cubic-bezier(0.34,1.15,0.64,1); }
  .form-group:focus-within .field-icon { color: #2a5aa8; transform: translateY(-50%) scale(1.15); }
  .eye-icon { transition: color 0.18s, transform 0.18s; }
  .eye-icon:hover { color: #2a5aa8; transform: translateY(-50%) scale(1.12); }

  /* ── 登录按钮：高光扫过 + ripple ── */
  .login-btn { position: relative; overflow: hidden; }
  .login-btn::before {
    content: ''; position: absolute; top: 0; left: -75%; width: 50%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: skewX(-20deg); transition: left 0.6s ease; pointer-events: none;
  }
  .login-btn:hover::before { left: 130%; }
  .ripple {
    position: absolute; border-radius: 50%; transform: scale(0);
    background: rgba(255,255,255,0.45); pointer-events: none;
    animation: rippleAnim 0.6s ease-out; will-change: transform, opacity;
  }

  /* ── 错误抖动 ── */
  .login-card.shake { animation: shake 0.45s cubic-bezier(0.36,0.07,0.19,0.97); }

  /* ── 无障碍降级 ── */
  @media (prefers-reduced-motion: reduce) {
    *, .login-card, .login-orb, .login-divider::after { animation: none !important; transition: none !important; }
  }
</style>
<script src="config.js"></script>
</head>
<body>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loading-overlay">
  <div class="spinner"></div>
</div>

<!-- ========== LOGIN PAGE ========== -->
<div id="login-page">
  <!-- Background -->
  <div class="login-bg">
    <div class="bg-image"></div>
  </div>

  <!-- 漂浮光斑 -->
  <div class="login-orbs">
    <div class="login-orb o1"></div>
    <div class="login-orb o2"></div>
    <div class="login-orb o3"></div>
  </div>

  <!-- Logo top-left -->
  <div class="login-logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.35C17.25 22.15 21 17.25 21 12V7L12 2zm0 2.18l7 3.9V12c0 4.35-2.98 8.4-7 9.63C7.98 20.4 5 16.35 5 12V8.08l7-3.9z"/>
        <path d="M10 12l-2-2-1.4 1.4L10 14.8l6-6L14.6 7.4z"/>
      </svg>
    </div>
    <div class="logo-text">
      <h1>HNGD</h1>
      <p>智能知识助手系统</p>
    </div>
  </div>

  <!-- Left text content -->
  <div class="login-left-content">
    <div class="login-main-title">企业知识库智能体</div>
    <div class="login-subtitle">
      <span>智能问答</span>
      <span class="dot">·</span>
      <span>知识检索</span>
      <span class="dot">·</span>
      <span>数据分析</span>
    </div>
    <div class="login-divider"></div>
  </div>

  <!-- Login Card -->
  <div class="login-card">
    <h2>用户登录</h2>
    <p class="subtitle">请输入您的账号信息</p>

    <div class="role-selector">
      <div class="role-indicator" id="role-indicator"></div>
      <button class="role-option active" data-role="user" onclick="selectRole('user', this)">用 户</button>
      <button class="role-option" data-role="admin" onclick="selectRole('admin', this)">管理员</button>
    </div>

    <div class="form-group">
      <span class="field-icon">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v2h20v-2c0-3.3-6.7-5-10-5z"/></svg>
      </span>
      <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" />
    </div>

    <div class="form-group">
      <span class="field-icon">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      </span>
      <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" />
      <span class="eye-icon" id="eye-toggle">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
      </span>
    </div>
    <div class="error-msg" id="error-msg">账号或密码错误，请重新输入</div>

    <div class="form-options">
      <label class="remember-me">
        <input type="checkbox" id="remember-me" /> 记住我
      </label>
      <a class="forgot-link" href="javascript:void(0)">忘记密码?</a>
    </div>

    <button class="login-btn" id="login-btn" onclick="handleLogin()">登 录</button>

    <div class="internal-account-note">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" style="color:#8a9ab8"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
      请使用内部账号登录
    </div>
  </div>

  <!-- <div class="login-copyright">© 2024 HNGD · 保密信息 严禁外泄</div> -->
</div>

<script>
  const API_BASE = window.APP_CONFIG.api_base;

  let selectedRole = 'user';

  function selectRole(role, btn) {
    selectedRole = role;
    document.querySelectorAll('.role-option').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('role-indicator').style.transform =
      role === 'admin' ? 'translateX(100%)' : 'translateX(0)';
  }

  async function handleLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('error-msg');

    if (!username || !password) {
      errorMsg.textContent = '请输入账号和密码';
      errorMsg.style.display = 'block';
      shakeCard();
      return;
    }

    errorMsg.style.display = 'none';
    document.getElementById('login-btn').disabled = true;

    try {
      const res = await fetch(`${API_BASE}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, role: selectedRole }),
      });

      const data = await res.json();

      if (!res.ok) {
        errorMsg.textContent = data.detail || '登录失败，请重试';
        errorMsg.style.display = 'block';
        document.getElementById('password').value = '';
        shakeCard();
        return;
      }

      // 存储 token 和用户信息（对照说明第三节）
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify({
        user_id:      data.user_id,
        username:     data.username,
        role:         data.role,
        display_name: data.display_name,
        avatar:       data.avatar || null,
      }));

      // 显示 loading 后跳转首页
      document.getElementById('loading-overlay').style.display = 'flex';
      setTimeout(() => {
        window.location.href = 'home-page.html';
      }, 600);

    } catch (err) {
      errorMsg.textContent = '网络错误，请检查服务是否启动';
      errorMsg.style.display = 'block';
      shakeCard();
    } finally {
      document.getElementById('login-btn').disabled = false;
    }
  }

  // ─── Password toggle ────────────────────────────
  document.getElementById('eye-toggle').addEventListener('click', function() {
    const pw = document.getElementById('password');
    pw.type = pw.type === 'password' ? 'text' : 'password';
  });

  // ─── Enter key ─────────────────────────────────
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') handleLogin();
  });

  // ─── 错误抖动 ───────────────────────────────────
  function shakeCard() {
    const card = document.querySelector('.login-card');
    card.classList.remove('shake');
    void card.offsetWidth;           // 强制重排以重启动画
    card.classList.add('shake');
  }

  // ─── 按钮点击波纹 ───────────────────────────────
  document.getElementById('login-btn').addEventListener('click', function(e) {
    const r = document.createElement('span');
    const d = Math.max(this.offsetWidth, this.offsetHeight);
    const rect = this.getBoundingClientRect();
    r.className = 'ripple';
    r.style.width = r.style.height = d + 'px';
    r.style.left = (e.clientX - rect.left - d / 2) + 'px';
    r.style.top  = (e.clientY - rect.top  - d / 2) + 'px';
    this.appendChild(r);
    setTimeout(() => r.remove(), 600);
  });
</script>

</body>
</html>
