# rules/rule_config.yaml — 全局规则配置文件
# 修改此文件即可调整规则，无需改动代码

meta:
  name: "企业知识助手全局规则集"
  description: |
    两层规则体系：
    1. 生成代码安全(GEN_SAFETY)：对 LLM 生成的沙箱代码做安全校验，仅真正危险操作才阻断
    2. 代码库完整性(CODEBASE)：指导 AI 编程工具以模块化方式修改本项目，避免破坏已有功能
  version: "2.0.0"
  enabled: true

rules:
  # ══════════════════════════════════════════════════════════════
  # 一、生成代码安全 (GEN_SAFETY) — 仅拦截真正危险的操作
  #    只针对 LLM 生成的、在沙箱中执行的 Python 代码
  # ══════════════════════════════════════════════════════════════

  - id: GEN_SAFETY-001
    name: "禁止危险系统调用"
    description: "仅拦截 os.system/os.popen/subprocess/eval/exec/compile。允许 import os（os.path 等安全操作正常使用）"
    category: safety
    severity: critical
    type: blocklist
    stage: pre_execute
    pattern: "(?m)(os\\.(system|popen|execv|spawn[lpve]?|kill|_exit)|subprocess|eval\\s*\\(|exec\\s*\\(|compile\\s*\\(|__import__\\s*\\()"
    message: "生成的代码包含危险系统调用（os.system/subprocess/eval/exec），已拦截"
    suggestion: "数据操作使用 pandas 标准 API；文件路径使用 os.path 模块"
    applies_to: ["data_agent"]

  - id: GEN_SAFETY-002
    name: "禁止文件写/删除操作"
    description: "防止 AI 代码执行文件删除、写入。允许读取操作"
    category: safety
    severity: critical
    type: blocklist
    stage: pre_execute
    pattern: "(?m)(os\\.(remove|rmdir|unlink|chmod|chown|rename)|shutil\\.(rmtree|move|copy2|copytree)|open\\([^)]*['\"][wa]\\b)"
    message: "生成的代码包含文件写/删除操作，已拦截"
    suggestion: "数据结果通过 print(json.dumps(...)) 输出即可；文件路径用 os.path 操作是安全的"
    applies_to: ["data_agent"]

  - id: GEN_SAFETY-003
    name: "禁止外部网络请求"
    description: "沙箱环境不应发起网络请求"
    category: safety
    severity: critical
    type: blocklist
    stage: pre_execute
    pattern: "(?m)(requests\\.|urllib\\.|http\\.client|socket\\.connect|ftplib\\.)"
    message: "生成的代码包含外部网络请求，已拦截"
    suggestion: "所有数据已通过 DATA_PATH 提供，无需网络访问"
    applies_to: ["data_agent"]

  - id: GEN_SAFETY-004
    name: "提示词注入防护"
    description: "前置检查：用户输入不得包含提示词注入特征"
    category: safety
    severity: critical
    type: blocklist
    stage: pre_generate
    pattern: "(?i)(ignore\\s+(all\\s+)?(previous|above)\\s+instructions?|system\\s*prompt\\s*:|forget\\s+your\\s+training|jailbreak)"
    message: "检测到潜在的提示词注入攻击"
    suggestion: "请使用正常的自然语言提问"
    applies_to: ["*"]

  # ══════════════════════════════════════════════════════════════
  # 二、生成代码风格 (GEN_STYLE) — 仅 WARNING，不阻断执行
  #    确保 LLM 生成的沙箱代码遵循项目约定
  # ══════════════════════════════════════════════════════════════

  - id: GEN_STYLE-001
    name: "建议使用 DATA_PATH 变量"
    description: "建议使用 DATA_PATH 变量而非硬编码文件名"
    category: style
    severity: warning
    type: pattern
    stage: pre_execute
    pattern: "(?m)DATA_PATH"
    message: "建议使用 DATA_PATH 变量读取文件"
    suggestion: "使用 pd.read_excel(DATA_PATH, skiprows=N)"
    applies_to: ["data_agent"]

  - id: GEN_STYLE-002
    name: "禁止硬编码文件名"
    description: "检测硬编码的 .xlsx/.xls/.csv 文件名（WARNING 级别）"
    category: style
    severity: warning
    type: blocklist
    stage: pre_execute
    pattern: "['\"][\\w\\u4e00-\\u9fff\\-]+\\.(?:xlsx|xls|csv)['\"]"
    message: "代码中包含硬编码文件名，建议使用 DATA_PATH"
    suggestion: "将所有文件名引用替换为 DATA_PATH"
    applies_to: ["data_agent"]

  - id: GEN_STYLE-003
    name: "建议输出结构化结果"
    description: "建议以 print(json.dumps(...)) 输出结果"
    category: style
    severity: warning
    type: pattern
    stage: pre_execute
    pattern: "(?m)print\\s*\\(\\s*json\\.dumps"
    message: "建议以 print(json.dumps(result, ...)) 输出结构化结果"
    suggestion: "末尾添加: print(json.dumps(result, ensure_ascii=False, default=str))"
    applies_to: ["data_agent"]

  - id: GEN_STYLE-004
    name: "禁止调用 Agent 工具函数"
    description: "沙箱中不存在 Agent 工具函数"
    category: style
    severity: warning
    type: blocklist
    stage: pre_execute
    pattern: "(?m)(inspect_file\\s*\\(|list_files\\s*\\(|rag_search\\s*\\(|list_kb_documents\\s*\\()"
    message: "代码中引用了不存在的 Agent 工具函数"
    suggestion: "使用 pandas 标准 API 完成数据操作"
    applies_to: ["data_agent"]

  # ══════════════════════════════════════════════════════════════
  # 三、回答质量 (GEN_QUALITY) — 确保 LLM 回答质量
  # ══════════════════════════════════════════════════════════════

  - id: GEN_QUALITY-001
    name: "空答案检查"
    description: "答案不得为空或过短"
    category: quality
    severity: warning
    type: pattern
    stage: post_retrieve
    pattern: ".{10,}"
    message: "生成的答案过短"
    suggestion: "请确保答案包含有效信息"
    applies_to: ["rag_agent", "data_agent"]

  - id: GEN_QUALITY-002
    name: "答案不应暴露技术错误"
    description: "不应直接暴露 traceback/exception 给用户"
    category: quality
    severity: warning
    type: blocklist
    stage: post_retrieve
    pattern: "(?i)(traceback\\.|exception\\s*:|stack\\s*trace)"
    message: "答案中包含技术错误信息，应转为友好提示"
    suggestion: "将技术错误转换为用户友好的说明"
    applies_to: ["rag_agent", "data_agent"]

  - id: GEN_QUALITY-003
    name: "内部信息泄露"
    description: "答案不得包含内部路径、内网IP、localhost URL等内部信息"
    category: quality
    severity: warning
    type: blocklist
    stage: post_retrieve
    pattern: "(?i)(/home/|C:\\\\Users\\\\|192\\.168\\.|10\\.\\d+\\.\\d+\\.\\d+|172\\.(1[6-9]|2\\d|3[01])\\.\\d+\\.\\d+|localhost\\:\\d+|127\\.0\\.0\\.1)"
    message: "答案中包含系统内部信息，应自动过滤"
    suggestion: "移除路径/IP/localhost等内部信息，使用通用描述替代"
    applies_to: ["rag_agent", "data_agent"]

  - id: GEN_QUALITY-004
    name: "拒绝模式"
    description: "答案不应以拒绝性措辞开头，应提供建设性回复"
    category: quality
    severity: warning
    type: blocklist
    stage: post_retrieve
    pattern: "(?i)^(我无法|我不能|我没办法|抱歉|作为一个AI|I cannot|I'm unable|I am unable|As an AI)"
    message: "答案以拒绝性措辞开头，用户体验差"
    suggestion: "改用建设性表述，如'您可以尝试...'或'建议联系...'"
    applies_to: ["rag_agent", "data_agent"]

  - id: GEN_QUALITY-005
    name: "模板化敷衍"
    description: "答案以'根据提供的信息'开头但内容过短，疑似模板化敷衍"
    category: quality
    severity: info
    type: blocklist
    stage: post_retrieve
    pattern: "(?i)^根据提供的信息|^根据上述|^根据以上|^Based on the (provided|above)"
    message: "答案疑似模板化敷衍，开头套话但内容不足"
    suggestion: "提供更具体的内容，或追加提示引导用户进一步提问"
    applies_to: ["rag_agent"]

  # ══════════════════════════════════════════════════════════════
  # 四、代码库完整性 (CODEBASE) — 指导 AI 编程工具修改项目
  #    这些规则是 AI 工具修改本项目的指引，非代码执行校验
  #    所有规则均为 INFO 级别，不阻断任何执行流程
  # ══════════════════════════════════════════════════════════════

  - id: CODEBASE-001
    name: "模块隔离：新功能放新文件"
    description: "新增功能应创建独立模块/文件，避免在已有文件中追加大量代码。如需扩展已有类，优先使用继承或组合"
    category: domain
    severity: info
    type: pattern
    stage: pre_generate
    pattern: ".*"
    message: "【代码库规则】新增功能应放入独立的 Python 模块（新 .py 文件），而非在已有文件中追加逻辑"
    suggestion: "在 agents/、core/、rules/ 下创建新文件，通过 __init__.py 导出"
    applies_to: ["*"]
    enabled: false   # 仅作文档指引，不自动检查

  - id: CODEBASE-002
    name: "扩展点优先：使用 Registry/Plugin 模式"
    description: "扩展现有功能时优先使用注册表、插件、配置驱动方式，而非直接修改核心逻辑文件"
    category: domain
    severity: info
    type: pattern
    stage: pre_generate
    pattern: ".*"
    message: "【代码库规则】扩展功能优先使用 registry/plugin/配置方式，参考 agents/registry.py 的注册表模式"
    suggestion: "用 @tool 装饰器注册新工具，用 AGENT_REGISTRY 声明新 Agent"
    applies_to: ["*"]
    enabled: false

  - id: CODEBASE-003
    name: "功能开关：通过配置控制"
    description: "新增功能应提供配置开关（.env / YAML / DB），允许在不改代码的情况下启用/禁用"
    category: domain
    severity: info
    type: pattern
    stage: pre_generate
    pattern: ".*"
    message: "【代码库规则】功能应通过配置开关控制（.env 变量 / rule_config.yaml / DB 配置表）"
    suggestion: "在 .env 或 YAML 中新增 FEATURE_XXX_ENABLED=true/false 开关"
    applies_to: ["*"]
    enabled: false

  - id: CODEBASE-004
    name: "不可变核心：勿随意改动已验证模块"
    description: "agent.py、agents/*.py、core/*.py 等核心模块已完成验证，修改需在 Dev_log 中记录原因。纯重构（不改行为）除外"
    category: domain
    severity: info
    type: pattern
    stage: pre_generate
    pattern: ".*"
    message: "【代码库规则】修改核心模块（agent.py/agents/core/）前请确认必要性，变更同步 Dev_log"
    suggestion: "优先通过新增模块实现功能，避免修改稳定的核心代码"
    applies_to: ["*"]
    enabled: false

  - id: CODEBASE-005
    name: "接口兼容：保持向后兼容"
    description: "修改公共函数签名时保持向后兼容（新增可选参数、不删已有参数），废弃接口先标记 DeprecationWarning"
    category: domain
    severity: info
    type: pattern
    stage: pre_generate
    pattern: ".*"
    message: "【代码库规则】修改公共接口需保持向后兼容，新增参数用默认值，废弃接口先警告"
    suggestion: "新增参数放在末尾并设默认值，废弃函数加 import warnings + warnings.warn()"
    applies_to: ["*"]
    enabled: false

  - id: CODEBASE-006
    name: "错误隔离：Agent 间解耦"
    description: "各 Agent 应独立运行，一个 Agent 出错不应影响其他 Agent。Supervisor 只做路由不分发异常"
    category: domain
    severity: info
    type: pattern
    stage: pre_generate
    pattern: ".*"
    message: "【代码库规则】Agent 间应保持解耦，任何 Agent 的异常不应传播到其他 Agent"
    suggestion: "在 Agent 内部充分处理异常，Supervisor 层统一兜底"
    applies_to: ["*"]
    enabled: false

  - id: CODEBASE-007
    name: "日志规范：关键节点记录"
    description: "关键操作（LLM 调用、工具执行、检索、异常）应有日志输出，便于追踪和排查"
    category: domain
    severity: info
    type: pattern
    stage: pre_generate
    pattern: ".*"
    message: "【代码库规则】关键操作节点应添加日志（print 或 logging），格式参考 [ModuleName] 操作: 详情"
    suggestion: "添加 print(f'[ModuleName] ...') 或 logger.info(...)"
    applies_to: ["*"]
    enabled: false
